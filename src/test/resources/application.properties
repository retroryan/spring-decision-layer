spring.ai.openai.api-key=${AWS_BEARER_TOKEN_BEDROCK:}
# Shared OpenAI model/timeout/token settings live in application-openai.properties (in
# src/main/resources, but on this test classpath too), so they only need to change in one place.
spring.profiles.include=openai

spring.main.banner-mode=off

# Left interactive (the default), so `./mvnw spring-boot:test-run` opens a shell against the
# throwaway Neo4j container. The graph and model tests never load the shell autoconfiguration
# (their contexts are scoped with @SpringBootTest(classes = ...)), so this does not affect them;
# run.sh forces non-interactive for its one-shot runs.

loan.seed.enabled=true

# Tracing for diagnosing a hung/slow model call: org.springframework.ai covers the advisor chain
# and ChatModel lifecycle; RestClient at TRACE (not just DEBUG) logs the outgoing request and
# response bodies, not just the status line, for the non-streaming call() path; reactor-netty
# covers the underlying HTTP connection lifecycle (DNS/connect/TLS), since spring-webflux is on
# the classpath and reactor-netty backs RestClient's request factory.
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client.RestClient=TRACE
logging.level.reactor.netty.http.client=DEBUG
