spring.ai.openai.base-url=https://bedrock-mantle.us-west-2.api.aws/openai/v1
spring.ai.openai.api-key=${AWS_BEARER_TOKEN_BEDROCK:}
spring.ai.openai.chat.model=xai.grok-4.6
spring.ai.openai.chat.max-tokens=4096

spring.main.banner-mode=off

# Left interactive (the default), so `./mvnw spring-boot:test-run` opens a shell against the
# throwaway Neo4j container. The graph and model tests never load the shell autoconfiguration
# (their contexts are scoped with @SpringBootTest(classes = ...)), so this does not affect them;
# run.sh forces non-interactive for its one-shot runs.

loan.seed.enabled=true
