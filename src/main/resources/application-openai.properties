spring.ai.openai.base-url=https://bedrock-mantle.us-west-2.api.aws/openai/v1

#spring.ai.openai.chat.model=xai.grok-4.6
spring.ai.openai.chat.model=openai.gpt-5.6-terra
#spring.ai.openai.chat.model=qwen.qwen3-coder-480b-a35b-instruct
#spring.ai.openai.chat.model=qwen.qwen3-235b-a22b-2507
#spring.ai.openai.chat.model=mistral.mistral-large-3-675b-instruct
# openai.* reasoning models (e.g. gpt-5.6-terra) reject max_tokens outright ("Unsupported
# parameter") and require max_completion_tokens instead.
spring.ai.openai.chat.max-completion-tokens=16384
# Grok 4.6 is a reasoning model. The OpenAI client's 60-second default can cancel a
# non-streaming, native-structured response before it reaches the decision advisor.
spring.ai.openai.timeout=3m
