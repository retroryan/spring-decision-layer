spring.ai.openai.api-key=${AWS_BEARER_TOKEN_BEDROCK}
# Shared OpenAI model/timeout/token settings live in application-openai.properties, on the
# classpath for both this app and test runs, so they only need to change in one place.
spring.profiles.include=openai

spring.main.banner-mode=off

# The app is an interactive Spring Shell by default, so `./mvnw spring-boot:test-run` opens a REPL
# where you can type `decide --company C-1042 --amount 250000`. run.sh forces non-interactive
# (-Dspring.shell.interactive.enabled=false) so a scripted run executes one command and exits.

spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

loan.neo4j.database=${NEO4J_DATABASE:}
loan.seed.enabled=true

# Tracing for diagnosing a hung/slow model call: shows the advisor chain and ChatModel
# lifecycle (org.springframework.ai), the outgoing request/response line and status
# (RestClient, used for the non-streaming call() path), and the underlying HTTP
# connection lifecycle (reactor-netty, since spring-webflux is on the classpath) so a
# DNS/connect/TLS hang is distinguishable from "request sent, waiting on the model".
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.reactor.netty.http.client=DEBUG
