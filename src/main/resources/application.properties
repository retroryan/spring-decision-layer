spring.ai.openai.base-url=https://bedrock-mantle.us-west-2.api.aws/openai/v1
spring.ai.openai.api-key=${AWS_BEARER_TOKEN_BEDROCK}
spring.ai.openai.chat.model=xai.grok-4.6
spring.ai.openai.chat.max-tokens=4096

spring.main.banner-mode=off

# The app is an interactive Spring Shell by default, so `./mvnw spring-boot:test-run` opens a REPL
# where you can type `decide --company C-1042 --amount 250000`. run.sh forces non-interactive
# (-Dspring.shell.interactive.enabled=false) so a scripted run executes one command and exits.

spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

loan.neo4j.database=${NEO4J_DATABASE:}
loan.seed.enabled=true
