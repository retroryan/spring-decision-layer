<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Spring AI Advisors Are the Interception Point</title>
  <desc id="description">Three stacked bands show a Spring AI advisor acting as middleware around a model call. The top band is the Agent, holding the code chatClient.prompt() ... .call(), noted as unchanged because it just asks its normal question. The middle band, drawn in the accent color, is a single CallAdvisor split by a dashed line into two halves of one unit: the left half enriches the request with graph context on the way in, and the right half records the decision back to the graph on the way out. A chip on the band's lower edge marks chain.nextCall(...) as the point in the middle where the call continues downward. The bottom band is the Model. A request arrow runs down the left side through the advisor into the model, and a response arrow runs back up the right side through the advisor to the agent, so the call passes through the advisor in both directions. A callout notes that this is one method, adviseCall(request, chain), where before is the code above chain.nextCall() and after is the code below it.</desc>

  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#183142" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#586570"/>
    </marker>
    <style>
      .heading { fill: #17212B; font-size: 50px; font-weight: 700; }
      .subtitle { fill: #53616D; font-size: 24px; }
      .legend-title { fill: #0B668E; font-size: 30px; font-weight: 700; }
      .legend-copy { fill: #53616D; font-size: 17px; }
      .relationship { fill: none; stroke: #586570; stroke-width: 8; marker-end: url(#arrow); }
      .relationship-label { fill: #394651; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .node-label { fill: #FFFFFF; font-size: 20px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
      .node-label-hub { fill: #FFFFFF; font-size: 23px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
      .property-label { fill: #0B668E; font-size: 19px; font-weight: 700; }
      .property-copy { fill: #53616D; font-size: 18px; }
      .property-copy-sm { fill: #53616D; font-size: 17px; }
      .caption { fill: #53616D; font-size: 17px; text-anchor: end; }
      .leader { fill: none; stroke: #8A98A4; stroke-width: 2.5; stroke-dasharray: 5 6; }
      .copy-light { fill: #EAFBFD; font-size: 19px; text-anchor: middle; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 20px; fill: #0B668E; }
      .code-chip { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 20px; fill: #17212B; text-anchor: middle; }
      .code-note { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; fill: #9FD4E2; text-anchor: middle; }
      .half-divider { fill: none; stroke: #EAFBFD; stroke-width: 3; stroke-dasharray: 8 8; opacity: 0.85; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <path d="M1230 0 H1600 V235 C1510 205 1455 140 1395 82 C1340 30 1280 20 1230 0 Z" fill="#0B668E"/>
  <path d="M1410 0 H1600 V94 C1536 62 1474 34 1410 0 Z" fill="#57A7B2" opacity="0.75"/>
  <path d="M0 900 V820 C115 790 205 800 298 850 C333 869 369 885 410 900 Z" fill="#0B668E"/>

  <text class="heading" x="66" y="78">Spring AI Advisors Are the Interception Point</text>
  <text class="subtitle" x="68" y="122">One advisor wraps the model call, seeing the request in and the response out.</text>

  <g aria-label="Legend">
    <circle cx="88" cy="190" r="12" fill="#0B668E"/>
    <text class="legend-title" x="118" y="199">Wraps</text>
    <text class="legend-copy" x="118" y="227">A CallAdvisor sits between</text>
    <text class="legend-copy" x="118" y="249">the agent and the model.</text>

    <circle cx="88" cy="300" r="12" fill="#0B668E"/>
    <text class="legend-title" x="118" y="309">Both directions</text>
    <text class="legend-copy" x="118" y="337">It sees the request going in</text>
    <text class="legend-copy" x="118" y="359">and the response coming out.</text>

    <circle cx="88" cy="410" r="12" fill="#0B668E"/>
    <text class="legend-title" x="118" y="419">No agent change</text>
    <text class="legend-copy" x="118" y="447">Context work happens without</text>
    <text class="legend-copy" x="118" y="469">touching the agent above it.</text>
  </g>

  <!-- Callout: one method, not two -->
  <g aria-label="Annotation about the single advisor method">
    <path class="leader" d="M480 600 C 502 599 518 598 536 597"/>
    <rect x="60" y="520" width="420" height="166" rx="16" fill="#F4FAFB" stroke="#B9DCE1" stroke-width="2"/>
    <text class="property-label" x="84" y="556">One method, not two</text>
    <text class="property-copy" x="84" y="588">adviseCall(request, chain)</text>
    <text class="property-copy" x="84" y="616">&#8220;Before&#8221; is the code above</text>
    <text class="property-copy" x="84" y="640">chain.nextCall(). &#8220;After&#8221; is</text>
    <text class="property-copy" x="84" y="664">the code below it.</text>
  </g>

  <!-- Request down the left, response up the right: agent to advisor -->
  <path class="relationship" d="M650 396 L650 461"/>
  <path class="relationship" d="M1440 461 L1440 396"/>
  <g filter="url(#soft-shadow)">
    <rect x="682" y="407" width="152" height="42" rx="14" fill="#FFFFFF" stroke="#586570" stroke-width="3"/>
    <text class="relationship-label" x="758" y="435">REQUEST</text>

    <rect x="1258" y="407" width="164" height="42" rx="14" fill="#FFFFFF" stroke="#586570" stroke-width="3"/>
    <text class="relationship-label" x="1340" y="435">RESPONSE</text>
  </g>

  <!-- Request down the left, response up the right: advisor to model -->
  <path class="relationship" d="M650 731 L650 786"/>
  <path class="relationship" d="M1440 786 L1440 731"/>

  <!-- Top band: the agent, unchanged -->
  <g aria-label="Agent band" filter="url(#soft-shadow)">
    <rect x="540" y="240" width="1010" height="150" rx="24" fill="#EDF1F4" stroke="#8A98A4" stroke-width="3"/>
  </g>
  <rect x="572" y="266" width="180" height="44" rx="22" fill="#0B668E"/>
  <text class="node-label" x="662" y="296">AGENT</text>
  <rect x="572" y="326" width="540" height="46" rx="12" fill="#FFFFFF" stroke="#B6C0C8" stroke-width="2"/>
  <text class="code" x="594" y="357">chatClient.prompt() ... .call()</text>
  <text class="caption" x="1518" y="292">The agent is unchanged.</text>
  <text class="caption" x="1518" y="318">It asks its normal question.</text>

  <!-- Middle band: one advisor, two halves -->
  <g aria-label="One CallAdvisor, drawn as a single unit split into two halves" filter="url(#soft-shadow)">
    <rect x="540" y="470" width="1010" height="255" rx="24" fill="#168AAD"/>
  </g>

  <g aria-label="Left half, on the way in">
    <rect x="572" y="520" width="444" height="170" rx="18" fill="#0B668E"/>
    <text class="node-label" x="794" y="562">ON THE WAY IN</text>
    <text class="copy-light" x="794" y="610">Enrich the request</text>
    <text class="copy-light" x="794" y="638">with graph context</text>
    <text class="code-note" x="794" y="672">above chain.nextCall()</text>
  </g>

  <g aria-label="Right half, on the way out">
    <rect x="1074" y="520" width="444" height="170" rx="18" fill="#0B668E"/>
    <text class="node-label" x="1296" y="562">ON THE WAY OUT</text>
    <text class="copy-light" x="1296" y="610">Record the decision</text>
    <text class="copy-light" x="1296" y="638">back to the graph</text>
    <text class="code-note" x="1296" y="672">below chain.nextCall()</text>
  </g>

  <!-- The two halves belong to one advisor: dashed seam, single label pill -->
  <path class="half-divider" d="M1045 505 L1045 703"/>
  <g filter="url(#soft-shadow)">
    <rect x="880" y="449" width="330" height="42" rx="21" fill="#0B668E"/>
    <text class="node-label" x="1045" y="476">ONE CallAdvisor</text>

    <rect x="915" y="703" width="260" height="46" rx="16" fill="#FFFFFF" stroke="#586570" stroke-width="3"/>
    <text class="code-chip" x="1045" y="734">chain.nextCall(...)</text>
  </g>

  <!-- Bottom band: the model -->
  <g aria-label="Model band" filter="url(#soft-shadow)">
    <rect x="540" y="794" width="1010" height="86" rx="20" fill="#2D6A8A"/>
  </g>
  <text class="node-label-hub" x="1045" y="845">MODEL</text>

</svg>
