<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">One Model, One Graph, Two Advisors</title>
  <desc id="description">PrecedentAdvisor and DecisionTraceAdvisor both sit inside LoanOfficer, wrapped by chat memory. PrecedentAdvisor sends the assembled file to the Bedrock Mantle Endpoint on the left and reads precedent from the Neo4j graph on the right. The same Bedrock endpoint returns its verdict to DecisionTraceAdvisor, which writes the decision back to the same Neo4j graph.</desc>

  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#183142" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#586570"/>
    </marker>
    <style>
      .heading { fill: #17212B; font-size: 44px; font-weight: 700; }
      .subtitle { fill: #53616D; font-size: 22px; }
      .legend-title { fill: #0B668E; font-size: 28px; font-weight: 700; }
      .legend-copy { fill: #53616D; font-size: 17px; }
      .relationship { fill: none; stroke: #586570; stroke-width: 6; marker-end: url(#arrow); }
      .relationship-label { fill: #394651; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .node-label { fill: #FFFFFF; font-size: 20px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
      .node-label-hub { fill: #FFFFFF; font-size: 21px; font-weight: 700; text-anchor: middle; letter-spacing: 0.5px; }
      .node-copy { fill: #EAFBFD; font-size: 15px; text-anchor: middle; }
      .panel-label { fill: #0B668E; font-size: 16px; font-weight: 700; }
      .panel-copy { fill: #394651; font-size: 13.5px; }
      .wrap-copy { fill: #17212B; font-size: 15px; text-anchor: middle; font-style: italic; }
      .caption { fill: #53616D; font-size: 17px; text-anchor: end; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <path d="M1230 0 H1600 V235 C1510 205 1455 140 1395 82 C1340 30 1280 20 1230 0 Z" fill="#0B668E"/>
  <path d="M1410 0 H1600 V94 C1536 62 1474 34 1410 0 Z" fill="#57A7B2" opacity="0.75"/>
  <path d="M0 900 V820 C115 790 205 800 298 850 C333 869 369 885 410 900 Z" fill="#0B668E"/>

  <text class="heading" x="66" y="72">One Model, One Graph, Two Advisors</text>
  <text class="subtitle" x="68" y="112">PrecedentAdvisor and DecisionTraceAdvisor both call the one model and share the one graph.</text>

  <!-- Outer wrap: LoanOfficer / chat memory -->
  <g aria-label="LoanOfficer wrap" filter="url(#soft-shadow)">
    <rect x="600" y="270" width="400" height="480" rx="34" fill="#77C8D0"/>
  </g>
  <text class="wrap-copy" x="800" y="340">chat memory wraps every turn</text>

  <g filter="url(#soft-shadow)">
    <rect x="695" y="248" width="210" height="42" rx="21" fill="#0B668E"/>
    <text class="node-label" x="800" y="275">LOANOFFICER</text>
  </g>

  <!-- User in / answer out -->
  <g filter="url(#soft-shadow)" aria-label="User">
    <rect x="695" y="150" width="210" height="50" rx="25" fill="#57A7B2"/>
    <text class="node-label" x="800" y="182">USER</text>
  </g>
  <path class="relationship" d="M800 200 L800 244"/>

  <g filter="url(#soft-shadow)" aria-label="LoanAnswer">
    <rect x="695" y="800" width="210" height="50" rx="25" fill="#57A7B2"/>
    <text class="node-label" x="800" y="832">LOAN ANSWER</text>
  </g>
  <path class="relationship" d="M800 750 L800 796"/>

  <!-- PrecedentAdvisor -->
  <g aria-label="PrecedentAdvisor" filter="url(#soft-shadow)">
    <rect x="640" y="360" width="320" height="150" rx="22" fill="#0B668E"/>
    <text class="node-label-hub" x="800" y="398">PRECEDENT ADVISOR</text>
    <text class="node-copy" x="800" y="426">reads company, policies,</text>
    <text class="node-copy" x="800" y="446">standing denials</text>
    <text class="node-copy" x="800" y="466">assembles the file</text>
  </g>

  <!-- DecisionTraceAdvisor -->
  <g aria-label="DecisionTraceAdvisor" filter="url(#soft-shadow)">
    <rect x="640" y="560" width="320" height="150" rx="22" fill="#168AAD"/>
    <text class="node-label-hub" x="800" y="598">DECISION TRACE ADVISOR</text>
    <text class="node-copy" x="800" y="626">checks the verdict,</text>
    <text class="node-copy" x="800" y="646">writes Decision + edges</text>
    <text class="node-copy" x="800" y="666">grants exceptions</text>
  </g>

  <!-- Bedrock model, left -->
  <g aria-label="Bedrock Mantle Endpoint" filter="url(#soft-shadow)">
    <rect x="70" y="470" width="290" height="200" rx="24" fill="#2D6A8A"/>
    <rect x="185" y="492" width="50" height="46" rx="8" fill="none" stroke="#EAFBFD" stroke-width="5"/>
    <rect x="197" y="504" width="26" height="22" rx="4" fill="#EAFBFD"/>
    <path d="M195 492 V480 M225 492 V480 M195 538 V550 M225 538 V550 M185 508 H173 M185 522 H173 M235 508 H247 M235 522 H247" stroke="#EAFBFD" stroke-width="5" stroke-linecap="round"/>
    <text class="node-label-hub" x="215" y="578">BEDROCK MANTLE</text>
    <text class="node-label-hub" x="215" y="602">ENDPOINT</text>
    <text class="node-copy" x="215" y="634">Claude Sonnet 5</text>
    <text class="node-copy" x="215" y="654">OpenAI-compatible API</text>
  </g>

  <!-- Arrows: advisors <-> Bedrock, both touching the same box -->
  <path class="relationship" d="M640 425 C 500 460 420 500 360 530"/>
  <g filter="url(#soft-shadow)">
    <rect x="435" y="470" width="130" height="38" rx="14" fill="#FFFFFF" stroke="#586570" stroke-width="2.5"/>
    <text class="relationship-label" x="500" y="495">sends file</text>
  </g>

  <path class="relationship" d="M360 615 C 420 640 500 655 640 630"/>
  <g filter="url(#soft-shadow)">
    <rect x="405" y="600" width="180" height="38" rx="14" fill="#FFFFFF" stroke="#586570" stroke-width="2.5"/>
    <text class="relationship-label" x="495" y="625">returns verdict</text>
  </g>

  <!-- Neo4j graph, right -->
  <g aria-label="Neo4j graph" filter="url(#soft-shadow)">
    <rect x="1240" y="360" width="290" height="420" rx="20" fill="#F4FAFB" stroke="#0B668E" stroke-width="3"/>
    <rect x="1243" y="363" width="284" height="48" rx="15" fill="#0B668E"/>
    <text class="node-label" x="1385" y="393">NEO4J GRAPH</text>

    <rect x="1258" y="425" width="254" height="140" rx="14" fill="#FFFFFF" stroke="#57A7B2" stroke-width="2"/>
    <text class="panel-label" x="1274" y="450">NODES</text>
    <text class="panel-copy" x="1274" y="473">Company, LoanApplication,</text>
    <text class="panel-copy" x="1274" y="493">Decision, Policy,</text>
    <text class="panel-copy" x="1274" y="513">Underwriter, Exception</text>

    <rect x="1258" y="580" width="254" height="180" rx="14" fill="#FFFFFF" stroke="#57A7B2" stroke-width="2"/>
    <text class="panel-label" x="1274" y="605">KEY EDGES</text>
    <text class="panel-copy" x="1274" y="628">APPLIED_POLICY, WEIGHED_PAST</text>
    <text class="panel-copy" x="1274" y="648">DECIDED_BY</text>
    <text class="panel-copy" x="1274" y="668">ESCALATED_FROM</text>
    <text class="panel-copy" x="1274" y="688">EXCEPTION_TO, GRANTED_BY</text>
  </g>

  <!-- Arrows: advisors <-> Neo4j -->
  <path class="relationship" d="M960 435 C 1050 445 1150 455 1240 465"/>
  <g filter="url(#soft-shadow)">
    <rect x="1040" y="470" width="120" height="36" rx="13" fill="#FFFFFF" stroke="#586570" stroke-width="2.5"/>
    <text class="relationship-label" x="1100" y="494">reads</text>
  </g>

  <path class="relationship" d="M960 640 C 1050 650 1150 655 1240 660"/>
  <g filter="url(#soft-shadow)">
    <rect x="1040" y="644" width="120" height="36" rx="13" fill="#FFFFFF" stroke="#586570" stroke-width="2.5"/>
    <text class="relationship-label" x="1100" y="668">writes</text>
  </g>

</svg>
