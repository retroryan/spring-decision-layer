<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Agents That Learn the Why</title>
  <desc id="description">A four-quarter timeline reading left to right. Along the top, a fleet of agent cards multiplies: one card in Q1, two in Q2, four in Q3, and eight in Q4, stacked in overlapping pairs so each quarter's pile is visibly larger than the last. A single fixed line runs beneath the whole fleet, crossed by identical short downward arrows labelled reads and writes; the interface never changes shape from one quarter to the next. Below that line sits the decision layer, drawn as a stepped wedge that thickens with each quarter, from a thin sliver in Q1 to a deep band in Q4. Each quarter holds its own separate graph of decision nodes and links, set apart by clear gaps: four faint nodes and three links under Q1, a small sparse graph under Q2, a larger one under Q3, and a dense woven graph at full strength under Q4. Each quarter's graph is what the fleet knows about why cases were settled, and the fleet only multiplies as fast as that record grows.</desc>

  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#183142" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#586570"/>
    </marker>
    <clipPath id="layer-clip">
      <path d="M240 430 H1560 V720 H1136 V628 H785 V558 H485 V488 H240 Z"/>
    </clipPath>
    <style>
      .heading { fill: #17212B; font-size: 50px; font-weight: 700; }
      .subtitle { fill: #53616D; font-size: 24px; }
      .row-label { fill: #17212B; font-size: 24px; font-weight: 700; letter-spacing: 2px; }
      .row-copy { fill: #394651; font-size: 20px; font-weight: 700; }
      .agent-label { fill: #17212B; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .axis-label { fill: #17212B; font-size: 24px; font-weight: 700; text-anchor: middle; }
      .interface { fill: none; stroke: #586570; stroke-width: 6; marker-end: url(#arrow); }
      .timeline { fill: none; stroke: #8A98A4; stroke-width: 4; marker-end: url(#arrow); }
      .leader { fill: none; stroke: #8A98A4; stroke-width: 2.5; stroke-dasharray: 5 6; }
      .mesh-link { fill: none; stroke: #586570; stroke-width: 2; stroke-opacity: 0.55; }
      .mesh-node { fill: #0B668E; }
      .callout-label { fill: #0B668E; font-size: 26px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <path d="M1230 0 H1600 V235 C1510 205 1455 140 1395 82 C1340 30 1280 20 1230 0 Z" fill="#0B668E"/>
  <path d="M1410 0 H1600 V94 C1536 62 1474 34 1410 0 Z" fill="#57A7B2" opacity="0.75"/>

  <text class="heading" x="66" y="78">Agents That Learn the Why</text>
  <text class="subtitle" x="68" y="122">Each quarter the record holds more of the why; trust is what lets the fleet grow.</text>

