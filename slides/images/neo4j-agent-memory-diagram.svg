<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Three Kinds of Memory in One Graph</title>
  <desc id="description">A single Neo4j graph split into three horizontal bands. The top band is long-term memory: Company, Policy, and Underwriter nodes holding enterprise knowledge the business already had. The middle band is reasoning memory: LoanApplication, Decision, and Exception nodes drawn in the deepest blue, where an Exception is EXCEPTION_TO a Decision and a Decision is ABOUT a LoanApplication. The bottom band is short-term memory: a Conversation node linked by FIRST_MESSAGE and NEXT_MESSAGE to two Message nodes, which is the Spring AI chat memory stored through Neo4jChatMemoryRepository. Dashed reference relationships run upward from the reasoning band into the long-term band: a Company SUBMITTED a LoanApplication, a Decision APPLIED_POLICY to a Policy, and an Exception was GRANTED_BY an Underwriter. A solid TRIGGERED relationship runs from a Message up into a Decision. Reasoning memory is drawn in the middle because it is the layer that connects the conversation to the knowledge, and it is the only memory that changes the next outcome.</desc>

  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#183142" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#586570"/>
    </marker>
    <marker id="arrow-ref" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8A98A4"/>
    </marker>
    <style>
      .heading { fill: #17212B; font-size: 50px; font-weight: 700; }
      .subtitle { fill: #53616D; font-size: 24px; }
      .band-title { fill: #0B668E; font-size: 28px; font-weight: 700; }
      .band-copy { fill: #53616D; font-size: 17px; }
      .legend-copy { fill: #53616D; font-size: 17px; }
      .relationship { fill: none; stroke: #586570; stroke-width: 6; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #8A98A4; stroke-width: 4; stroke-dasharray: 9 8; }
      .reference-head { fill: none; stroke: #8A98A4; stroke-width: 4; stroke-dasharray: 9 8; marker-end: url(#arrow-ref); }
      .relationship-label { fill: #394651; font-size: 17px; font-weight: 700; text-anchor: middle; letter-spacing: 0.5px; }
      .node-label-dark { fill: #17212B; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .node-label-light { fill: #FFFFFF; font-size: 21px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <path d="M1230 0 H1600 V235 C1510 205 1455 140 1395 82 C1340 30 1280 20 1230 0 Z" fill="#0B668E"/>
  <path d="M1410 0 H1600 V94 C1536 62 1474 34 1410 0 Z" fill="#57A7B2" opacity="0.75"/>
  <path d="M0 900 V820 C115 790 205 800 298 850 C333 869 369 885 410 900 Z" fill="#0B668E"/>

  <text class="heading" x="66" y="78">Three Kinds of Memory in One Graph</text>
  <text class="subtitle" x="68" y="122">One Neo4j instance holds all three. Only reasoning memory changes the next outcome.</text>

  <g aria-label="Edge style legend">
    <path d="M70 188 H 128" fill="none" stroke="#586570" stroke-width="6"/>
    <text class="legend-copy" x="140" y="194">written by the agent</text>
    <path d="M400 188 H 458" fill="none" stroke="#8A98A4" stroke-width="4" stroke-dasharray="9 8"/>
    <text class="legend-copy" x="470" y="194">reference into knowledge the business already had</text>
  </g>

  <!-- Band labels -->
  <g aria-label="Band labels">
    <circle cx="80" cy="282" r="12" fill="#77C8D0" stroke="#57A7B2" stroke-width="3"/>
    <text class="band-title" x="110" y="291">Long-term memory</text>
    <text class="band-copy" x="110" y="319">Enterprise knowledge the business</text>
    <text class="band-copy" x="110" y="341">already holds: companies, policies,</text>
    <text class="band-copy" x="110" y="363">thresholds, people.</text>

    <circle cx="80" cy="522" r="12" fill="#0B668E"/>
    <text class="band-title" x="110" y="531">Reasoning memory</text>
    <text class="band-copy" x="110" y="559">What was decided, and what</text>
    <text class="band-copy" x="110" y="581">authorized it. This is the memory</text>
    <text class="band-copy" x="110" y="603">that becomes precedent.</text>

    <circle cx="80" cy="711" r="12" fill="#B9DCE1" stroke="#77C8D0" stroke-width="3"/>
    <text class="band-title" x="110" y="720">Short-term memory</text>
    <text class="band-copy" x="110" y="748">The conversation itself, stored by</text>
    <text class="band-copy" x="110" y="770">Spring AI through</text>
    <text class="band-copy" x="110" y="792">Neo4jChatMemoryRepository.</text>
  </g>

  <!-- Reasoning band references up into long-term memory -->
  <path class="reference-head" d="M650 342 V 380"/>
  <path class="reference" d="M650 434 V 478"/>
  <text class="relationship-label" x="650" y="418">SUBMITTED</text>

  <path class="reference-head" d="M990 478 V 440"/>
  <path class="reference" d="M990 396 V 342"/>
  <text class="relationship-label" x="990" y="418">APPLIED_POLICY</text>

  <path class="reference-head" d="M1330 478 V 440"/>
  <path class="reference" d="M1330 396 V 342"/>
  <text class="relationship-label" x="1330" y="418">GRANTED_BY</text>

  <!-- Short-term band triggers a decision -->
  <path class="relationship" d="M902 722 L 964 586"/>
  <text class="relationship-label" x="1015" y="662">TRIGGERED</text>

  <!-- Within-band relationships -->
  <path class="relationship" d="M1205 530 H 1127"/>
  <text class="relationship-label" x="1155" y="500">EXCEPTION_TO</text>

  <path class="relationship" d="M865 530 H 787"/>
  <text class="relationship-label" x="825" y="500">ABOUT</text>

  <path class="relationship" d="M665 762 H 767"/>
  <text class="relationship-label" x="715" y="732">FIRST_MESSAGE</text>

  <path class="relationship" d="M985 762 H 1087"/>
  <text class="relationship-label" x="1036" y="732">NEXT_MESSAGE</text>

  <!-- Long-term memory nodes -->
  <g aria-label="Long-term memory nodes" filter="url(#soft-shadow)">
    <ellipse cx="650" cy="290" rx="118" ry="52" fill="#77C8D0" stroke="#57A7B2" stroke-width="4"/>
    <ellipse cx="990" cy="290" rx="118" ry="52" fill="#77C8D0" stroke="#57A7B2" stroke-width="4"/>
    <ellipse cx="1330" cy="290" rx="118" ry="52" fill="#77C8D0" stroke="#57A7B2" stroke-width="4"/>
  </g>
  <text class="node-label-dark" x="650" y="298">Company</text>
  <text class="node-label-dark" x="990" y="298">Policy</text>
  <text class="node-label-dark" x="1330" y="298">Underwriter</text>

  <!-- Reasoning memory nodes -->
  <g aria-label="Reasoning memory nodes" filter="url(#soft-shadow)">
    <ellipse cx="650" cy="530" rx="125" ry="52" fill="#0B668E"/>
    <ellipse cx="990" cy="530" rx="125" ry="52" fill="#0B668E"/>
    <ellipse cx="1330" cy="530" rx="125" ry="52" fill="#0B668E"/>
  </g>
  <text class="node-label-light" x="650" y="538">LoanApplication</text>
  <text class="node-label-light" x="990" y="538">Decision</text>
  <text class="node-label-light" x="1330" y="538">Exception</text>

  <!-- Short-term memory nodes -->
  <g aria-label="Short-term memory nodes" filter="url(#soft-shadow)">
    <ellipse cx="560" cy="762" rx="105" ry="46" fill="#B9DCE1" stroke="#77C8D0" stroke-width="4"/>
    <ellipse cx="880" cy="762" rx="105" ry="46" fill="#B9DCE1" stroke="#77C8D0" stroke-width="4"/>
    <ellipse cx="1200" cy="762" rx="105" ry="46" fill="#B9DCE1" stroke="#77C8D0" stroke-width="4"/>
  </g>
  <text class="node-label-dark" x="560" y="770">Conversation</text>
  <text class="node-label-dark" x="880" y="770">Message</text>
  <text class="node-label-dark" x="1200" y="770">Message</text>

</svg>
