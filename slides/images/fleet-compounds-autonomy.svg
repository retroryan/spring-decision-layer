<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Agents That Learn the Why</title>
  <desc id="description">A four-quarter timeline reading left to right, in four horizontal bands. The top band is human review, drawn as four separate boxes, one per quarter, that fade from solid to almost white: every case in Q1, most cases in Q2, some cases in Q3, rare in Q4. Upward arrows run from the fleet into that band and thin out with it, from one thick solid arrow in Q1 to a single faint dashed stub in Q4, so the supervision drains away from left to right. The second band is the fleet. Each agent is a card of the same size in every quarter, and each card carries a small horizontal meter showing the share of cases that agent settles alone, filled a sliver in Q1 and nearly full in Q4. The fleet also multiplies, from one card in Q1 to two, four, and eight. Beneath the fleet a single fixed line runs the whole width, crossed by identical short downward arrows labelled reads and writes, one per agent on the bottom row; the interface never changes shape from one quarter to the next. Below that line sits the decision layer, drawn as a stepped wedge that thickens with each quarter, from a thin sliver in Q1 to a deep band in Q4. Each quarter holds its own separate graph of decision nodes and links, set apart by clear gaps: four faint nodes and three links under Q1, a small sparse graph under Q2, a larger one under Q3, and a dense woven graph at full strength under Q4. The card meter, the fading review band, and the thickening record all move together, so the frame reads as one mechanism: the record holds more of the why, so each agent is trusted with more, and fewer cases come back to a person.</desc>

