<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Every Agent Costs Less Than the One Before</title>
  <desc id="description">Two opposing wedges mirrored across a gutter of arrows. Along the top, five bars stand in build order from left to right, labelled Agent 1 through Agent 5, and they shrink steeply from tallest to shortest. The vertical axis is labelled only qualitatively as cost to stand up, with no numbers, gridlines or tick marks, because the bar heights are a schematic of the trend rather than measured data. Under each bar a second caption records what it inherits: Agent 1 starts from zero, Agent 2 reuses one, Agent 3 reuses two, Agent 4 reuses three, Agent 5 reuses four. Below each bar a pair of short arrows crosses the gutter, one pointing down labelled writes and one pointing up labelled reads, connecting every agent to the shared decision layer beneath. That layer is drawn as a single unbroken band whose fill deepens continuously from pale grey on the left to solid blue on the right, so it reads as one accumulating record rather than five separate stores. A caption row under the band names what accrues at each step: policies, then exceptions, then precedent, then outcomes, then authorizations. A final pair of opposing arrows spells out the mirroring, pointing left for each agent carries less and right for the shared record holds more. The closing line states that nothing was taken away, it just stopped living in the agent.</desc>

  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#183142" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#586570"/>
    </marker>
    <marker id="arrow-sm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#586570"/>
    </marker>
    <linearGradient id="record-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4EDF2"/>
      <stop offset="0.3" stop-color="#A6C8DA"/>
      <stop offset="0.62" stop-color="#3E8FB5"/>
      <stop offset="1" stop-color="#0B668E"/>
    </linearGradient>
    <style>
      .heading { fill: #17212B; font-size: 50px; font-weight: 700; }
      .subtitle { fill: #53616D; font-size: 24px; }
      .axis-label { fill: #0B668E; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .side-label { fill: #0B668E; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .bar-name { fill: #17212B; font-size: 24px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
      .bar-sub { fill: #53616D; font-size: 20px; text-anchor: middle; }
      .tick { stroke: #8A98A4; stroke-width: 4; stroke-linecap: round; }
      .gutter { fill: none; stroke: #586570; stroke-width: 5; marker-end: url(#arrow-sm); }
      .gutter-label { fill: #53616D; font-size: 19px; }
      .accrual { fill: #53616D; font-size: 20px; text-anchor: middle; }
      .mirror-arrow { fill: none; stroke: #586570; stroke-width: 6; marker-end: url(#arrow); }
      .mirror-label { fill: #394651; font-size: 21px; font-weight: 700; }
      .closing { fill: #17212B; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <path d="M1230 0 H1600 V235 C1510 205 1455 140 1395 82 C1340 30 1280 20 1230 0 Z" fill="#0B668E"/>
  <path d="M1410 0 H1600 V94 C1536 62 1474 34 1410 0 Z" fill="#57A7B2" opacity="0.75"/>
  <path d="M0 900 V820 C115 790 205 800 298 850 C333 869 369 885 410 900 Z" fill="#0B668E"/>

  <text class="heading" x="66" y="78">Every Agent Costs Less Than the One Before</text>
  <text class="subtitle" x="68" y="118">The fifth agent inherits what the first four already settled.</text>

  <!-- Qualitative axis label. No numbers, no gridlines: the bar heights are a schematic. -->
  <text class="axis-label" x="66" y="196">COST TO</text>
  <text class="axis-label" x="66" y="224">STAND UP</text>

  <!-- Shrinking wedge: per-agent cost to stand up, in build order -->
  <g aria-label="Cost to stand up, per agent, shrinking left to right" filter="url(#soft-shadow)">
    <path d="M330 462 V174 Q330 162 342 162 H468 Q480 162 480 174 V462 Z" fill="#0B668E"/>
    <path d="M570 462 V264 Q570 252 582 252 H708 Q720 252 720 264 V462 Z" fill="#17739B"/>
    <path d="M810 462 V329 Q810 317 822 317 H948 Q960 317 960 329 V462 Z" fill="#2681A8"/>
    <path d="M1050 462 V379 Q1050 367 1062 367 H1188 Q1200 367 1200 379 V462 Z" fill="#348CB0"/>
    <path d="M1290 462 V416 Q1290 404 1302 404 H1428 Q1440 404 1440 416 V462 Z" fill="#3E8FB5"/>
  </g>

  <g aria-label="Baseline ticks">
    <path class="tick" d="M322 464 H488"/>
    <path class="tick" d="M562 464 H728"/>
    <path class="tick" d="M802 464 H968"/>
    <path class="tick" d="M1042 464 H1208"/>
    <path class="tick" d="M1282 464 H1448"/>
  </g>

  <g aria-label="Agent labels">
    <text class="bar-name" x="405" y="500">AGENT 1</text>
    <text class="bar-sub"  x="405" y="528">from zero</text>
    <text class="bar-name" x="645" y="500">AGENT 2</text>
    <text class="bar-sub"  x="645" y="528">reuses 1</text>
    <text class="bar-name" x="885" y="500">AGENT 3</text>
    <text class="bar-sub"  x="885" y="528">reuses 2</text>
    <text class="bar-name" x="1125" y="500">AGENT 4</text>
    <text class="bar-sub"  x="1125" y="528">reuses 3</text>
    <text class="bar-name" x="1365" y="500">AGENT 5</text>
    <text class="bar-sub"  x="1365" y="528">reuses 4</text>
  </g>

  <!-- Gutter: every agent writes down into the record and reads back up out of it -->
  <g aria-label="Writes and reads between each agent and the shared record">
    <path class="gutter" d="M385 550 V610"/>
    <path class="gutter" d="M425 610 V550"/>
    <path class="gutter" d="M625 550 V610"/>
    <path class="gutter" d="M665 610 V550"/>
    <path class="gutter" d="M865 550 V610"/>
    <path class="gutter" d="M905 610 V550"/>
    <path class="gutter" d="M1105 550 V610"/>
    <path class="gutter" d="M1145 610 V550"/>
    <path class="gutter" d="M1345 550 V610"/>
    <path class="gutter" d="M1385 610 V550"/>
    <text class="gutter-label" x="368" y="586" text-anchor="end">writes</text>
    <text class="gutter-label" x="442" y="586">reads</text>
  </g>

  <!-- Growing wedge: one continuous record, deepening left to right -->
  <text class="side-label" x="66" y="656">DECISION</text>
  <text class="side-label" x="66" y="686">LAYER</text>
  <g filter="url(#soft-shadow)">
    <rect x="318" y="620" width="1134" height="96" rx="24" fill="url(#record-fill)" stroke="#B9DCE1" stroke-width="2"/>
  </g>

  <g aria-label="What accrues at each step">
    <text class="accrual" x="405" y="752">policies</text>
    <text class="accrual" x="645" y="752">+ exceptions</text>
    <text class="accrual" x="885" y="752">+ precedent</text>
    <text class="accrual" x="1125" y="752">+ outcomes</text>
    <text class="accrual" x="1365" y="752">+ authorizations</text>
  </g>

  <!-- The mirroring, said out loud -->
  <g aria-label="The two directions">
    <path class="mirror-arrow" d="M488 802 H340"/>
    <text class="mirror-label" x="510" y="810">each agent carries less</text>
    <text class="mirror-label" x="1260" y="810" text-anchor="end">the shared record holds more</text>
    <path class="mirror-arrow" d="M1282 802 H1430"/>
  </g>

  <text class="closing" x="885" y="858">Nothing was taken away. It just stopped living in the agent.</text>
</svg>
