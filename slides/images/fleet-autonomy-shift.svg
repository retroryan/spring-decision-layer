  <path d="M1410 0 H1600 V94 C1536 62 1474 34 1410 0 Z" fill="#57A7B2" opacity="0.75"/>

  <text class="heading" x="66" y="62">Agents That Earn Autonomy</text>
  <text class="subtitle" x="68" y="100">The fleet grows and its agents go autonomous, because the record of why keeps deepening.</text>

