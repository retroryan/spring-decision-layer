<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Agents That Earn Autonomy</title>
  <desc id="description">A key sits at the top of the frame, above the drawing. It is headed AGENTS and reads left to right as a change of kind: a plain white square with a gray outline labelled Agents, then an arrow pointing right, then a solid blue five pointed star labelled Autonomous Agents. Below the key runs a four quarter timeline, left to right. In each quarter the fleet is drawn with those two shapes. Q1 holds one plain square and no stars. Q2 holds one plain square and one star. Q3 holds one plain square and three stars, arranged two over two. Q4 holds eight stars and no squares, arranged four over four. So the fleet doubles every quarter and, at the same time, its plain squares turn into stars until every agent is autonomous. A single fixed line runs beneath the whole fleet, crossed by identical short downward arrows labelled reads and writes, one arrow per agent on the bottom row. The arrows are the same length and the same shape in every quarter, so the agents change while the contract they use does not. Below that line sits the decision layer, drawn as a stepped wedge that thickens with each quarter, from a thin sliver under Q1 to a deep band under Q4. Each quarter holds its own separate graph of decision nodes and links, set apart by clear gaps and drawn at rising opacity: four faint nodes and three links under Q1, a small sparse graph under Q2, a larger one under Q3, and a dense woven graph at full strength under Q4. A callout in the open space below the thin part of the wedge states that agents go autonomous because the record of why got deeper. A time axis crosses the bottom with one label per quarter, from Q1 with one agent to Q4 with eight agents.</desc>

